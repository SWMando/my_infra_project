#  vars:
#    var_record: "{{ item.key }}"
#    var_host: "{{ item.value }}"
#  with_items: "{{ dns_cname_records | dict2items | slice(6,8) }}"

- name: Append CNAME records of the services to the database file
  community.general.nsupdate:
    key_name: "nsupdate.key"
    key_algorithm: "hmac-sha256"
    key_secret: "{{ nsupdate_key_secret }}"
    server: "127.0.0.1"
    zone: "{{ my_domain }}"
    record: "{{ item.key }}"
    type: "CNAME"
    value: "{{ item.value }}"
  run_once: true
  notify: Reload rndc
  delegate_to: "{{ groups['dns_masters'][0] }}"
  with_items: "{{ (dns_cname_records | dict2items)[6:9]}}"
  no_log: true

- name: Enable Bind
  service:
    name: named
    state: started
    enabled: true
