- name: INstalling Prometheus
  apt:
    name: prometheus
    state: present

- name: Service Prometheus
  service:
    name: prometheus
    state: started
    enabled: true

- name: Uplaod Prometheus config /etc/prometheus/prometheus.yml
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
  notify: Restart Prometheus

- name: Upload Prometheus config to /etc/default/prometheus
  template:
    src: prometheus.j2
    dest: /etc/default/prometheus
  notify: Restart Prometheus

