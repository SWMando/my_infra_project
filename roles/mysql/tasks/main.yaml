# This section is related to Lab 4+ and AGAMA App
- name: Install Mysql server
  apt:
    name: mysql-server
    state: present

- name: Installing Ansible Mysql dependency
  apt:
    name: python3-pymysql
    state: present

- name: Enabling and Starting Mysql service
  service:
    name: mysql
    state: started
    enabled: true

- name: Copying from local to remove override.cnf file
  template:
    src: override.cnf.j2
    dest: /etc/mysql/mysql.conf.d/override.cnf
  notify: Restart Mysql

- name: Adding Mysql Database
  community.mysql.mysql_db:
    name: "{{ mysql_database }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  notify:
    - Reset MySQL source
    - Reset MySQL replica

- name: Adding Mysql user
  community.mysql.mysql_user:
    name: "{{ mysql_user }}"
    password: "{{ mysql_password }}"
    host: "%"
    priv: "{{ mysql_database }}.*:ALL"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
  notify: Restart Mysql
#
# This section is related to Lab 6+ and Prometheus
- name: Installing prometheus-mysql-exporter
  apt:
    name: prometheus-mysqld-exporter
    state: present


- name: Adding exporter user
  community.mysql.mysql_user:
    name: "{{ mysql_exporter_user }}"
    password: "{{ mysql_exporter_password }}"
    host: "localhost"
    priv: "*.*:PROCESS,REPLICATION CLIENT,SELECT"
    resource_limits:
      MAX_USER_CONNECTIONS: 3
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
  notify: Restart Mysql

- name: Add my.cnf file
  template:
    src: my.cnf.j2
    dest: /var/lib/prometheus/.my.cnf
    mode: '0600'
  no_log: true
#
# This section is related to Lab 9+ and Backup User
- name: Creating MySQL backup user
  community.mysql.mysql_user:
    name: "{{ backup_srv_host }}"
    password: "{{ backup_password_mysql }}"
    host: "localhost"
    priv: "{{ mysql_database }}.*:SELECT,LOCK TABLES"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
  notify: Restart Mysql

- name: Add my.cnf for backup
  template:
    src: backup.my.cnf.j2
    dest: /home/backup/.my.cnf
    owner: backup
    group: backup
    mode: '0400'
  no_log: true
#
# This is to break Ansible's regular order and run handlers now not at the end (Needed because of prometheus-mysql-exporter)
- name: Flush Mysql Handlers
  meta: flush_handlers

- name: Enable prometheus-mysqld-exporter
  service:
    name: prometheus-mysqld-exporter
    state: started
    enabled: true
#
# This section is related to Lab 9+ and Backup User
- name: Create /home/backup/mysql directory
  file:
    path: /home/backup/mysql
    state: directory
    owner: backup
    group: backup

- name: Cron task for backup
  template:
    src: mysql-backup.j2
    dest: /etc/cron.d/mysql-backup
  notify: Restart cron
#
# This section is related to Lab 11+
- name: Create MySQL user for REPLICATION
  community.mysql.mysql_user:
    name: "{{ replication_user_mysql }}"
    password: "{{ replication_password_mysql }}"
    host: "%"
    priv: "*.*:REPLICATION SLAVE"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
  notify: Restart Mysql

- name: Setting one of the servers to Read-Only mode to later become a replica
  community.mysql.mysql_variables:
    variable: read_only
    value: "{{ 'OFF' if inventory_hostname == mysql_host else 'ON' }}"
    mode: persist
    login_unix_socket: /var/run/mysqld/mysqld.sock
  notify:
    - Reset MySQL source
    - Reset MySQL replica

